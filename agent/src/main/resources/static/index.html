<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>多智能体个性化学习系统</title>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f3f4f6; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 850px; background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 20px; display: flex; flex-direction: column; height: 85vh; }
        .chat-box { flex: 1; overflow-y: auto; padding: 10px; border: 1px solid #e5e7eb; border-radius: 8px; background: #f9fafb; margin-bottom: 20px; }
        .message { margin-bottom: 15px; display: flex; flex-direction: column; }
        .message.user { align-items: flex-end; }
        .message.bot { align-items: flex-start; }
        .bubble { max-width: 90%; padding: 12px 18px; border-radius: 12px; line-height: 1.6; font-size: 15px; word-wrap: break-word; }
        .user .bubble { background: #3b82f6; color: white; border-bottom-right-radius: 2px; }
        .bot .bubble { background: #ffffff; color: #1f2937; border: 1px solid #e5e7eb; border-bottom-left-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .bot .bubble p { margin: 8px 0; }
        .bot .bubble h1, .bot .bubble h2, .bot .bubble h3 { margin: 12px 0 6px 0; color: #1d4ed8; font-size: 16px; }
        .input-area { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 14px; border: 1px solid #d1d5db; border-radius: 8px; outline: none; font-size: 15px; transition: border-color 0.2s; }
        input[type="text"]:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
        button { padding: 0 24px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600; transition: background 0.2s; }
        button:hover { background: #2563eb; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        .loading { font-size: 14px; color: #3b82f6; font-weight: bold; margin-bottom: 10px; display: none; text-align: center; }

        .question-block { margin-bottom: 20px; border-bottom: 1px dashed #e5e7eb; padding-bottom: 15px; }
        .quiz-question { margin-bottom: 10px; font-weight: bold; color: #111827; }
        .quiz-options { margin-left: 15px; color: #4b5563; margin-bottom: 5px; }
        .quiz-answer { margin-top: 5px; font-weight: bold; color: #059669; }
        .quiz-source { font-size: 12px; color: #9ca3af; font-weight: normal; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align: center; color: #1f2937; margin-top: 0;">🎓 多智能体个性化学习系统</h2>
    <div class="chat-box" id="chatBox">
        <div class="message bot">
            <div class="bubble">你好！我是你的专属 AI 导师。你可以让我：<br>1. 解释知识点（如：解释求根公式）<br>2. 制定学习计划（如：帮我制定学习计划）<br>3. 出测试题（如：出几道测试题）</div>
        </div>
    </div>
    <div class="loading" id="loading">智能体正在查阅知识库并思考中，请稍候...</div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="输入你的问题，按回车发送..." onkeypress="handleKeyPress(event)">
        <button id="sendBtn" onclick="sendMessage()">发送</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        input.value = '';

        const loading = document.getElementById('loading');
        const sendBtn = document.getElementById('sendBtn');
        loading.style.display = 'block';
        sendBtn.disabled = true;

        const chatBox = document.getElementById('chatBox');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message bot';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerHTML = `<b>【智能体正在生成...】</b><br>`;
        msgDiv.appendChild(bubble);
        chatBox.appendChild(msgDiv);

        try {
            const response = await fetch('http://localhost:8082/api/agent/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });

            if (!response.ok) throw new Error('网络请求失败');
            loading.style.display = 'none';

            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');

            let fullReply = "";
            let isFirstChunk = true;

            // 流式输出阶段
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                let chunkStr = decoder.decode(value, { stream: true });
                chunkStr = chunkStr.replace(/data:/g, '').trim();

                if (chunkStr) {
                    if (isFirstChunk) {
                        bubble.innerHTML = "";
                        isFirstChunk = false;
                    }
                    fullReply += chunkStr;
                    bubble.innerHTML = `<div style="white-space: pre-wrap;">${fullReply}</div>`;
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            }

            // ====== 流式结束，最终排版渲染 ======
            let finalHtml = "";

            // 1. 判断是否为混合意图（有分割线）
            if (fullReply.includes("---我是分割线---")) {
                let parts = fullReply.split("---我是分割线---");
                let planPart = cleanText(parts[0]);
                let assessPart = cleanText(parts[1]);

                finalHtml += `<b>【规划教学智能体】</b><br>` + marked.parse(planPart) + `<br><hr><br>`;
                finalHtml += `<b>【测试评估智能体】</b><br>` + renderAssessment(assessPart);
            }
            // 2. 判断是否为纯出题（包含 JSON 标记）
            else if (fullReply.includes('"questions"') || fullReply.includes('```json')) {
                let assessPart = cleanText(fullReply);
                finalHtml += `<b>【测试评估智能体】</b><br>` + renderAssessment(assessPart);
            }
            // 3. 普通文本（讲解或计划）
            else {
                let cleanCons = cleanText(fullReply);

                // 【核心排版修复】：如果大模型把 ### 和文字连在一起，强行换行拆开
                cleanCons = cleanCons
                    .replace(/###/g, '\n\n### ')
                    .replace(/\*\*(.*?)\*\*/g, '\n\n**$1**')
                    .replace(/-\s/g, '\n- ')
                    .trim();

                finalHtml += `<b>【AI 导师】</b><br>` + marked.parse(cleanCons);
            }

            bubble.innerHTML = finalHtml;

            // 触发 MathJax 渲染公式
            if (window.MathJax) {
                MathJax.typesetPromise([bubble]).catch(function (err) {
                    console.log('MathJax渲染错误: ', err.message);
                });
            }

        } catch (error) {
            bubble.innerHTML = "抱歉，系统出错了。请重试。";
        } finally {
            loading.style.display = 'none';
            sendBtn.disabled = false;
            input.focus();
        }
    }

    // 辅助清理中文换行乱码
    function cleanText(text) {
        if (!text) return "";
        return text.replace(/([\u4e00-\u9fa5])\s*\n\s*([\u4e00-\u9fa5])/g, '$1$2')
            .replace(/([\u4e00-\u9fa5])\s*\n\s*([\u4e00-\u9fa5])/g, '$1$2');
    }

    // 渲染试卷组件（超级容错版）
    function renderAssessment(text) {
        let cleanStr = text.replace(/```json/g, '').replace(/```/g, '').trim();
        if (cleanStr.includes('"questions"')) {
            try {
                let startIndex = cleanStr.indexOf('{');
                let endIndex = cleanStr.lastIndexOf('}');
                if (startIndex !== -1 && endIndex !== -1 && startIndex < endIndex) {
                    let jsonStr = cleanStr.substring(startIndex, endIndex + 1).replace(/[\r\n]+/g, ' ');
                    let jsonObj = JSON.parse(jsonStr);
                    if (jsonObj.questions && jsonObj.questions.length > 0) {
                        let html = "";
                        jsonObj.questions.forEach((q, index) => {
                            html += `<div class="question-block">`;
                            html += `<div class="quiz-question">${index + 1}. ${q.stem}</div>`;
                            html += `<div class="quiz-options">`;
                            if (q.options) { q.options.forEach(opt => { html += `${opt}<br>`; }); }
                            html += `</div>`;
                            html += `<div class="quiz-answer">答案：${q.answer} <span class="quiz-source">[来源: ${q.source}]</span></div>`;
                            html += `</div>`;
                        });
                        return html;
                    }
                }
            } catch (e) {
                console.error("JSON解析依然失败：", e);
                return `<div style="color: #ef4444;"><b>解析格式失败：</b>请直接查看下方原文</div><pre style="font-size:12px;">${cleanStr}</pre>`;
            }
        }
        return marked.parse(text);
    }

    function addMessage(text, sender) {
        const chatBox = document.getElementById('chatBox');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        msgDiv.appendChild(bubble);

        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }
</script>

</body>
</html>
