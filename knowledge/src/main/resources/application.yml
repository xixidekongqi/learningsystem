server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/learning_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
  ai:
    openai:
      api-key: api-key: ${OPENAI_API_KEY}
      base-url: https://api.siliconflow.cn
      embedding:
        options:
          model: BAAI/bge-m3
      chat:
        options:
          model: Qwen/Qwen2.5-7B-Instruct
    vectorstore:
      milvus:
        client:
          host: localhost
          port: 29530  # 【注意这里改成了 29530】
        database-name: default
        collection-name: learning_chunks
        embedding-dimension: 1024
        index-type: IVF_FLAT
        metric-type: COSINE
        initialize-schema: true